name: iNaiHR Holy Cringe ru integrity

on:
  pull_request:
    paths:
      - 'janus.html'
      - 'tools/apply_holy_cringe_ru_v1.py'
      - '.github/workflows/inaihr-holy-cringe-ru-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'janus.html'
      - 'tools/apply_holy_cringe_ru_v1.py'
      - '.github/workflows/inaihr-holy-cringe-ru-integrity.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: inaihr-holy-cringe-ru-v1
  cancel-in-progress: false

jobs:
  validate-or-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic Holy Cringe migration
        run: python tools/apply_holy_cringe_ru_v1.py
      - name: Validate semantic parody boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('janus.html').read_text(encoding='utf-8')
          for token in [
            'СВЯТОЙ КРИНЖ',
            'ПАРОДИЙНЫЙ СЛОЙ',
            'Вымышленная Ванесса Шевченко',
            'Never imitate a real author',
            'never invent biography',
            'exact sourcePaths',
            "janus-site-language-v1"
          ]:
            assert token in s, token
          assert "lang==='ru'?" in s
          assert "sourcePaths:(c.sourcePaths||[]).filter" in s
          forbidden=['/api/hrain/save','/api/hrain/event',"method:'DELETE'","method:'PUT'","method:'PATCH'"]
          for token in forbidden:
            assert token not in s, token
          print('RU_HOLY_CRINGE=PASS')
          print('SOURCEPATH_GROUNDING=PASS')
          print('REGISTRY_MUTATION=ABSENT')
          PY
      - name: Commit migrated janus.html on main safely
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- janus.html; then
            echo 'No migration diff.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add janus.html
            git commit -m 'feat(inaihr): activate Holy Cringe ru semantic mode'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Request Pages rebuild
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" >/tmp/pages.json
          cat /tmp/pages.json
