name: iNaiHR semantic sync envelope compatibility

on:
  pull_request:
    paths:
      - 'janus.html'
      - 'tools/apply_semantic_sync_envelope_v3.py'
      - '.github/workflows/inaihr-semantic-sync-envelope.yml'
  push:
    branches: [main]
    paths:
      - 'janus.html'
      - 'tools/apply_semantic_sync_envelope_v3.py'
      - '.github/workflows/inaihr-semantic-sync-envelope.yml'

permissions:
  contents: write
  pages: write

jobs:
  validate-or-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatibility migration in workspace
        run: python tools/apply_semantic_sync_envelope_v3.py
      - name: Validate backend envelope and semantic boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('janus.html').read_text(encoding='utf-8')
          assert "data?.candidates?.[0]?.content?.parts?.[0]?.text" in s
          assert "/api/hrain/sync" in s
          assert "LOCAL SEMANTIC" in s
          assert "sourcePaths" in s
          assert "janus-site-language-v1" in s
          assert s.count("method:'POST'")==1
          for token in ['/api/hrain/save','/api/hrain/event',"method:'DELETE'","method:'PUT'","method:'PATCH'"]:
              assert token not in s, token
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/inaihr-semantic.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('GEMINI_COMPAT_ENVELOPE=PASS')
          print('LOCAL_FALLBACK=PASS')
          print('REGISTRY_MUTATION=ABSENT')
          PY
          node --check /tmp/inaihr-semantic.js
      - name: Commit migrated semantic page on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- janus.html; then
            echo 'No migration diff.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add janus.html
            git commit -m 'fix(inaihr): parse JANUS sync compatibility envelope'
            git push
          fi
      - name: Request Pages rebuild
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" >/tmp/pages.json
          cat /tmp/pages.json
