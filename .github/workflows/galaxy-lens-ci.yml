name: JANUS Galaxy Volume v2 · GPU and provenance gates
on:
  pull_request:
    paths:
      - "galaxy.html"
      - "assets/janus-volume-*.mjs"
      - "tests/janus_volume*"
      - ".github/workflows/galaxy-lens-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node module syntax checks
        run: |
          node --check assets/janus-volume-model.mjs
          node --check assets/janus-volume-render.mjs
          node --check assets/janus-volume-ui.mjs
      - name: Deterministic topology and perspective contracts
        run: node --test tests/janus_volume.test.mjs
      - name: Install Chromium and Playwright
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install chromium
      - name: GPU WebGL2 3D live browser smoke
        run: python tests/janus_volume_browser.py
      - name: Attach visual preview for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-3d-preview
          path: janus-volume-preview.png
          if-no-files-found: ignore
