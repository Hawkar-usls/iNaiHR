name: JANUS Native Organism UI Preservation
on:
  pull_request:
    paths:
      - 'index.html'
      - 'spore-original.html'
      - 'ai-nexus-original.html'
      - 'janus.html'
      - 'janus-map.html'
      - 'memory.html'
      - 'assets/janus-native-atlas.js'
      - 'assets/janus-explicit-links.js'
      - 'tests/test_janus_explicit_links.py'
      - 'tests/test_janus_native_atlas.py'
      - 'tests/test_janus_relation_ui.py'
      - 'tests/janus_relation_browser_smoke.py'
      - 'tests/janus_atlas_facets_browser.py'
      - 'tests/test_janus_atlas_facets.py'
      - 'tests/test_original_inaihr_restoration.py'
      - 'tests/inaihr_originals_browser.py'
      - '.github/workflows/janus-native-atlas-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'spore-original.html'
      - 'ai-nexus-original.html'
      - 'janus.html'
      - 'janus-map.html'
      - 'memory.html'
      - 'assets/janus-native-atlas.js'
      - 'assets/janus-explicit-links.js'
      - 'tests/test_janus_explicit_links.py'
      - 'tests/test_janus_native_atlas.py'
      - 'tests/test_janus_relation_ui.py'
      - 'tests/janus_relation_browser_smoke.py'
      - 'tests/janus_atlas_facets_browser.py'
      - 'tests/test_janus_atlas_facets.py'
      - 'tests/test_original_inaihr_restoration.py'
      - 'tests/inaihr_originals_browser.py'
      - '.github/workflows/janus-native-atlas-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve-real-neural-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard native D3/brains and SHA-only source admission
        run: python -m unittest discover -v -s tests -p 'test_janus_native_atlas.py'
      - name: Full-corpus relation UI truth-classification guard
        run: python -m unittest discover -v -s tests -p 'test_janus_relation_ui.py'
      - name: Exact JSON field reference and pinned-commit regression
        run: python -m unittest discover -v -s tests -p 'test_janus_explicit_links.py'
      - name: Guard path/version metadata, SHA-only source and native graph safety
        run: python -m unittest discover -v -s tests -p 'test_janus_atlas_facets.py'
      - name: Validate native browser module syntax
        run: node --check assets/janus-native-atlas.js
      - name: Validate explicit-reference module syntax
        run: node --check assets/janus-explicit-links.js
      - name: Install Chrome browser driver for native end-to-end test
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Original D3 and compiled relation overlay Chrome regression
        env:
          JANUS_ORGANISM: iNaiHR
        run: python tests/janus_relation_browser_smoke.py
      - name: Guard historical secret, ngrok and mutating API removal from restored originals
        run: python -m unittest discover -v -s tests -p 'test_original_inaihr_restoration.py'
      - name: Chromium original SPORE and purple AI Nexus, real public Cosmos source edge, no writes
        run: python tests/inaihr_originals_browser.py
      - name: Real source SHA version/path directory filters in native D3
        run: python tests/janus_atlas_facets_browser.py
      - name: Verify original source family has not been replaced
        run: |
          python - <<'PY'
          from pathlib import Path
          home=Path('index.html').read_text()
          organism=Path('janus.html').read_text()
          assert '<script src="./assets/janus-native-atlas.js"' in home
          assert '<script src="./assets/janus-native-atlas.js"' in organism
          assert 'window.JANUSAtlasNativeFocus' in organism
          assert 'd3.v7.min.js' in home and 'd3.v7.min.js' in organism
          print('JANUS_NATIVE_ORGANISM=ORIGINAL_UI_SOURCE_ONLY_OVERLAY_PASS')
          PY
