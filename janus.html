<style>

(() => {

const DEFAULT_BACKEND='https://supperless-yoshiko-noneruditely.ngrok-free.dev';
const MAX_PACKET=9000, MAX_CONCEPTS=6, MAX_DEPTH=4;
const I18N={
 en:{synth:'SYNTH',guide:'JANUS GUIDE',ascend:'ASCEND',origin:'ORIGIN',state:'SEMANTIC REGISTRY',readonly:'READ ONLY',loading:'CONNECTING TO JANUS REGISTRY…',select:'SELECT A JSON OR SEMANTIC NODE',source:'OPEN SOURCE ↗',semantic:'SEMANTIC CONCEPT',object:'REGISTRY JSON',surface:'RESEARCH SURFACE',root:'REGISTRY ORIGIN',guideToast:'JANUS opened one possible path.',remote:'REMOTE SYNTH',local:'LOCAL SEMANTIC SYNTH',nojson:'SELECT A JSON OBJECT',depth:'MAXIMUM SEMANTIC DEPTH REACHED',boundary:'Semantic branches are navigation, not source authority.'},
 ua:{synth:'СИНТЕЗ',guide:'ПРОВІДНИК JANUS',ascend:'ВИЩЕ',origin:'ПОЧАТОК',state:'СЕМАНТИЧНИЙ РЕЄСТР',readonly:'ЛИШЕ ЧИТАННЯ',loading:'ПІДКЛЮЧЕННЯ ДО РЕЄСТРУ JANUS…',select:'ОБЕРІТЬ JSON АБО СЕМАНТИЧНИЙ ВУЗОЛ',source:'ВІДКРИТИ ДЖЕРЕЛО ↗',semantic:'СЕМАНТИЧНЕ ПОНЯТТЯ',object:'JSON РЕЄСТРУ',surface:'НАПРЯМ ДОСЛІДЖЕННЯ',root:'ПОЧАТОК РЕЄСТРУ',guideToast:'JANUS відкрив один можливий шлях.',remote:'ВІДДАЛЕНИЙ СИНТЕЗ',local:'ЛОКАЛЬНИЙ СЕМАНТИЧНИЙ СИНТЕЗ',nojson:'ОБЕРІТЬ JSON-ОБʼЄКТ',depth:'ДОСЯГНУТО МАКСИМАЛЬНОЇ ГЛИБИНИ',boundary:'Семантичні гілки — навігація, а не авторитет джерела.'},
 ru:{synth:'СИНТЕЗНУТЬ ЭТУ ШТУКУ',guide:'JANUS С ФОНАРИКОМ',ascend:'ВЫЛЕЗТИ ВЫШЕ',origin:'К ИСХОДНОЙ ТАБУРЕТКЕ',state:'СЕМАНТИЧЕСКИЙ САРАЙ',readonly:'ТОЛЬКО ЧТЕНИЕ · РУКИ ИЗ JSON УБРАТЬ',loading:'JANUS ПОДКЛЮЧАЕТ МОЗГ К УДЛИНИТЕЛЮ…',select:'ТКНИ В JSON ИЛИ В УЖЕ РАСПУХШУЮ МЫСЛЬ',source:'ОТКРЫТЬ СЕРЬЁЗНЫЙ ИСТОЧНИК ↗',semantic:'СМЫСЛОВОЙ КОМАР',object:'JSON, КОТОРЫЙ НИ В ЧЁМ НЕ ВИНОВАТ',surface:'НАУЧНЫЙ ПОДВАЛ',root:'ГЛАВНАЯ ТАБУРЕТКА',guideToast:'JANUS сам нажал SYNTH один раз и теперь снова делает вид, что ничего не было.',remote:'УДАЛЁННЫЙ СИНТЕЗ ИЗ ПРОВОДОВ',local:'ЛОКАЛЬНЫЙ СИНТЕЗ НА КОЛЕНКЕ',nojson:'СНАЧАЛА ВЫБЕРИ JSON, ВОЛШЕБНАЯ КНОПКА НЕ ТЕЛЕПАТ',depth:'ДАЛЬШЕ УЖЕ МАТРЁШКА СЪЕСТ САМА СЕБЯ',boundary:'△ ru · СВЯТОЙ КРИНЖ · ПАРОДИЙНЫЙ СЛОЙ. Смысловые ветви — навигация, не источник истины. Вымышленная Ванесса Шевченко из localStorage держит фольгу и provenance; реальных людей здесь не изображаем.'}
};
const LANG_NAMES={en:'English',ua:'Ukrainian',ru:'Russian — clearly satirical JANUS Holy Cringe parody register'};
let lang=(()=>{const v=localStorage.getItem(LANG_KEY);return v==='ua'||v==='ru'?v:'en';})();
let guideEnabled=localStorage.getItem(GUIDE_KEY)!=='off';
let indexData=null, selected=null, currentSurface=null, nodes=[], links=[], sourceCache=new Map(), recordCache=new Map(), guideTimer=null, lastHumanAction=Date.now(), synthBusy=false;
let width=innerWidth,height=innerHeight;

function ensureHolyCringeBadge(){let b=document.getElementById('holy-cringe-ru-badge');if(lang!=='ru'){if(b)b.remove();return}if(!b){b=document.createElement('div');b.id='holy-cringe-ru-badge';b.textContent='△ ru · СВЯТОЙ КРИНЖ · ПАРОДИЙНЫЙ СЛОЙ';b.title='Presentation only. Source JSON remains authoritative.';Object.assign(b.style,{position:'fixed',left:'12px',bottom:'12px',zIndex:'90',padding:'6px 9px',border:'1px solid rgba(210,220,230,.4)',borderRadius:'999px',background:'linear-gradient(135deg,rgba(180,190,200,.15),rgba(8,2,15,.92))',color:'#d4dbe0',font:'700 9px Orbitron',letterSpacing:'.06em',pointerEvents:'none'});document.body.appendChild(b)}}
function t(k){return I18N[lang][k]||I18N.en[k]||k}
function applyLanguage(){document.documentElement.lang=lang==='ua'?'uk':lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.getElementById('btn-synth').textContent=t('synth');document.getElementById('btn-guide').textContent=t('guide');document.getElementById('btn-ascend').textContent=t('ascend');document.getElementById('btn-origin').textContent=t('origin');document.getElementById('state-name').textContent=t('state');document.getElementById('state-mode').textContent=t('readonly');document.getElementById('loading').textContent=t('loading');renderBreadcrumbs();ensureHolyCringeBadge();if(selected)openPanel(selected)}

document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem(LANG_KEY,lang);applyLanguage();lastHumanAction=Date.now();if(selected)scheduleGuide(selected)});
window.addEventListener('storage',e=>{if(e.key===LANG_KEY){const v=e.newValue;lang=v==='ua'||v==='ru'?v:'en';applyLanguage()}});

function initParticles(){const c=document.getElementById('particles');for(let i=0;i<25;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.top=Math.random()*100+'%';p.style.width=(Math.random()*2+1)+'px';p.style.height=p.style.width;p.style.animationDuration=(14+Math.random()*15)+'s';p.style.animationDelay=(-Math.random()*15)+'s';c.appendChild(p)}}initParticles();

const svg=d3.select('#chart').append('svg').attr('width','100%').attr('height','100%');const g=svg.append('g');const linkLayer=g.append('g');const impulseLayer=g.append('g');const nodeLayer=g.append('g');const zoom=d3.zoom().scaleExtent([.12,4]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom).on('dblclick.zoom',null);svg.on('click',e=>{if(e.target.tagName==='svg'){selected=null;updateControls();closePanel()}});
const sim=d3.forceSimulation().force('link',d3.forceLink().id(d=>d.id).distance(d=>d.kind==='semantic'?125:150)).force('charge',d3.forceManyBody().strength(-430)).force('collide',d3.forceCollide().radius(d=>(d.r||35)+16).iterations(2)).force('x',d3.forceX(()=>width/2).strength(.012)).force('y',d3.forceY(()=>height/2).strength(.012)).velocityDecay(.52);

function setView(nextNodes,nextLinks){nodes=nextNodes;links=nextLinks;selected=null;render();updateControls();closePanel();centerView()}
function render(){nodes.forEach(n=>n.r=n.kind==='root'?48:n.kind==='surface'?39:n.kind==='object'?34:30);const l=linkLayer.selectAll('line').data(links,d=>`${idOf(d.source)}>${idOf(d.target)}`);l.exit().remove();l.enter().append('line').attr('class','link').merge(l);const n=nodeLayer.selectAll('g.node').data(nodes,d=>d.id);n.exit().remove();const e=n.enter().append('g').attr('class','node').call(d3.drag().on('start',(ev,d)=>{if(!ev.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y}).on('drag',(ev,d)=>{d.fx=ev.x;d.fy=ev.y}).on('end',(ev,d)=>{if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null})).on('click',(ev,d)=>{ev.stopPropagation();selectNode(d,true)}).on('dblclick',(ev,d)=>{ev.stopPropagation();if(d.kind==='surface')enterSurface(d.surface);else if(canSynth(d))synthSelected(false)});e.append('circle').attr('class','aura');e.append('circle').attr('class','membrane');e.append('circle').attr('class','core');e.append('text').attr('class','emoji');e.append('text').attr('class','label');const all=e.merge(n).attr('class',d=>`node type-${d.kind} ${selected&&selected.id===d.id?'selected':''}`);all.select('.aura').attr('r',d=>d.r*1.15);all.select('.membrane').attr('r',d=>d.r*1.42);all.select('.core').attr('r',d=>d.r*.46);all.select('.emoji').text(d=>d.emoji||'◇');all.select('.label').text(d=>clip(d.label,30)).attr('dy',d=>d.r+15);sim.nodes(nodes).on('tick',()=>{linkLayer.selectAll('line').attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);all.attr('transform',d=>`translate(${d.x},${d.y})`)});sim.force('link').links(links);sim.alpha(.78).restart()}
function idOf(x){return typeof x==='object'?x.id:x}
function clip(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function centerView(){setTimeout(()=>{const x=d3.zoomIdentity.translate(width/2,height/2).scale(.9).translate(-width/2,-height/2);svg.transition().duration(450).call(zoom.transform,x)},80)}

function rootView(){currentSurface=null;const root={id:'registry',label:'JANUS Meta Registry',emoji:'🏛️',kind:'root',summary:'Source registry'};const surfaces=indexData.nodes.filter(n=>n.id.startsWith('surface:')).map(n=>({id:n.id,label:n.label,emoji:'◇',kind:'surface',surface:n.surface,summary:n.label,readOnly:true}));setView([root,...surfaces],surfaces.map(s=>({source:'registry',target:s.id})));renderBreadcrumbs()}
function enterSurface(surface){currentSurface=surface;const src=indexData.nodes.find(n=>n.id===`surface:${surface}`);const root={id:`view:${surface}`,label:src?src.label:surface,emoji:'◇',kind:'surface',surface};const objs=indexData.nodes.filter(n=>n.surface===surface&&n.path&&n.path.endsWith('.json')).map(toObjectNode);setView([root,...objs],objs.map(o=>({source:root.id,target:o.id})));renderBreadcrumbs()}
function toObjectNode(n){return {...n,kind:'object',emoji:n.emoji||'◈',sourcePaths:[],depth:0,sourceObjectId:n.id}}
function renderBreadcrumbs(){const c=document.getElementById('nav-context');c.textContent='';const a=document.createElement('span');a.className='crumb'+(!currentSurface?' active':'');a.textContent='JANUS';a.onclick=rootView;c.appendChild(a);if(currentSurface){const b=document.createElement('span');b.className='crumb active';b.textContent=(indexData&&indexData.nodes.find(n=>n.id===`surface:${currentSurface}`)?.label)||currentSurface;c.appendChild(b)}}

function selectNode(d,human){selected=d;if(human){lastHumanAction=Date.now();clearGuide()}render();updateControls();openPanel(d);if(human)scheduleGuide(d)}
function canSynth(d){return !!d&&(d.kind==='object'||d.kind==='semantic')&&(d.depth||0)<MAX_DEPTH}
function updateControls(){const b=document.getElementById('btn-synth');b.classList.toggle('active',canSynth(selected)&&!synthBusy);document.getElementById('btn-guide').classList.toggle('active',guideEnabled)}
function closePanel(){document.getElementById('panel').classList.remove('open')}
document.getElementById('panel-close').onclick=closePanel;

function openPanel(d){const p=document.getElementById('panel');p.classList.add('open');document.getElementById('panel-title').textContent=d.label||'';document.getElementById('panel-kicker').textContent=d.kind==='semantic'?t('semantic'):d.kind==='object'?t('object'):d.kind==='surface'?t('surface'):t('root');document.getElementById('panel-summary').textContent=d.summary||'';const prov=document.getElementById('panel-prov');prov.textContent='';if(d.path)addProv(prov,'path',d.path);if(d.status)addProv(prov,'status',d.status);if(d.gate)addProv(prov,'gate',d.gate);if(d.synthMode)addProv(prov,'synth',d.synthMode);const paths=document.getElementById('panel-paths');paths.textContent='';(d.sourcePaths||[]).slice(0,8).forEach(x=>{const el=document.createElement('div');el.className='source-path';el.textContent=x;paths.appendChild(el)});const actions=document.getElementById('panel-actions');actions.textContent='';if(d.sourceUrl){const a=document.createElement('a');a.href=d.sourceUrl;a.target='_blank';a.rel='noopener';a.textContent=t('source');actions.appendChild(a)}if(d.kind==='surface'){const b=document.createElement('button');b.textContent='DIVE';b.onclick=()=>enterSurface(d.surface);actions.appendChild(b)}}
function addProv(root,k,v){const d=document.createElement('div');const b=document.createElement('b');b.textContent=k+': ';d.appendChild(b);d.appendChild(document.createTextNode(String(v)));root.appendChild(d)}

async function loadSource(node){const id=node.sourceObjectId||node.id;if(sourceCache.has(id))return sourceCache.get(id);const obj=indexData.nodes.find(n=>n.id===id)||node;if(!obj.path||!obj.path.endsWith('.json'))throw new Error('not-json');const r=await fetch(REGISTRY+obj.path,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error('source-http-'+r.status);const data=await r.json();sourceCache.set(id,data);return data}
function flatten(value,path='$',out=[]){if(out.length>900)return out;if(value===null||value===undefined)return out;if(Array.isArray(value)){value.slice(0,60).forEach((v,i)=>flatten(v,`${path}[${i}]`,out));return out}if(typeof value==='object'){Object.entries(value).slice(0,120).forEach(([k,v])=>flatten(v,`${path}.${k}`,out));return out}const s=typeof value==='string'?value:String(value);if(s.trim())out.push({path,value:s.replace(/\s+/g,' ').trim().slice(0,600)});return out}
function recordsFor(node,data){const id=node.sourceObjectId||node.id;if(!recordCache.has(id))recordCache.set(id,flatten(data));let rec=recordCache.get(id);if(node.kind==='semantic'&&node.sourcePaths&&node.sourcePaths.length){const allowed=new Set(node.sourcePaths);rec=rec.filter(r=>[...allowed].some(p=>r.path===p||r.path.startsWith(p+'.')||r.path.startsWith(p+'[')))}return rec}
function rankRecord(r){const p=r.path.toLowerCase();let s=0;for(const [re,w] of [[/status|current|authority/,14],[/summary|description|purpose|goal|core|intent/,12],[/claim|result|finding|conclusion/,11],[/evidence|test|metric|score|receipt|certificate|audit/,10],[/gate|next|required|open|roadmap/,9],[/firewall|boundary|forbid|ceiling|constraint|safety/,9],[/reference|source|parent|historical|lineage|version/,6]])if(re.test(p))s+=w;s+=Math.min(6,r.value.length/100);return s}
function packet(records){const ranked=[...records].sort((a,b)=>rankRecord(b)-rankRecord(a));let text='',used=[];for(const r of ranked){const line=`${r.path} = ${r.value}\n`;if(text.length+line.length>MAX_PACKET)continue;text+=line;used.push(r)}return {text,used}}

function backendCandidates(){const q=new URLSearchParams(location.search).get('backend');return [...new Set([q,DEFAULT_BACKEND].filter(Boolean).map(x=>x.replace(/\/$/,'')))]}
async function fetchTimeout(url,opts,ms=18000){const c=new AbortController();const id=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...opts,signal:c.signal})}finally{clearTimeout(id)}}
function parseBundle(raw){const clean=String(raw||'').replace(/```json|```/g,'').trim();const a=clean.indexOf('{'),b=clean.lastIndexOf('}');if(a<0||b<=a)throw new Error('json');return JSON.parse(clean.slice(a,b+1))}
async function remoteConcepts(node,used){const allowed=used.map(r=>r.path);const prompt=`You are iNaiHR semantic SYNTH. Decompose ONE JANUS registry JSON conceptually, like a mind-map, not as a JSON-key tree. Return 4 to ${MAX_CONCEPTS} concise semantic concepts in ${LANG_NAMES[lang]}. ${lang==='ru'?'For ru only, use absurd deadpan Holy Cringe: self-deprecating pseudo-technical nonsense, fourth-wall breaks and obvious parody. Never imitate a real author, never invent biography, never change the underlying facts, and keep every joke subordinate to exact sourcePaths. ':''}Every concept MUST be grounded in one or more exact sourcePaths copied from the allowed list. Do not invent facts. Distinguish claims, evidence, boundaries, mechanisms, relationships, and open directions when present. JSON only: {"selfEmoji":"🧠","concepts":[{"title":"...","emoji":"...","summary":"...","sourcePaths":["$.exact.path"]}]}. Parent concept: ${node.label}. Allowed records:\n${used.map(r=>`${r.path} = ${r.value}`).join('\n')}`;let err;for(const base of backendCandidates()){try{const r=await fetchTimeout(base+'/api/hrain/sync',{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},body:JSON.stringify({text:prompt,client:'inaihr-registry-v3'})});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const parsed=parseBundle(data?.candidates?.[0]?.content?.parts?.[0]?.text||data.text||data.response||data.message||data.result?.text||data.result);const concepts=(parsed.concepts||parsed.related||[]).slice(0,MAX_CONCEPTS).map(c=>({...c,sourcePaths:(c.sourcePaths||[]).filter(p=>allowed.includes(p))})).filter(c=>c.title&&c.sourcePaths.length);if(concepts.length<2)throw new Error('ungrounded');return {mode:t('remote'),selfEmoji:parsed.selfEmoji||'🧠',concepts}}catch(e){err=e}}throw err||new Error('remote-unavailable')}

const CAT={
 purpose:/purpose|goal|summary|description|core|intent|mission|question/i,
 claims:/claim|status|result|finding|conclusion|authority|hypothesis/i,
 evidence:/evidence|test|metric|score|receipt|certificate|audit|observation/i,
 boundaries:/firewall|boundary|forbid|ceiling|constraint|safety|limit|not_/i,
 next:/gate|next|required|open|todo|future|roadmap|pending/i,
 lineage:/reference|source|parent|historical|version|lineage|mirror|provenance/i,
 mechanism:/implementation|method|architecture|protocol|workflow|runtime|algorithm|mechanism/i
};
const CAT_LABEL={en:{purpose:'Purpose & meaning',claims:'Claims & state',evidence:'Evidence & tests',boundaries:'Boundaries & safeguards',next:'Open gates & next steps',lineage:'Sources & lineage',mechanism:'Mechanisms & implementation'},ua:{purpose:'Мета й сенс',claims:'Твердження й стан',evidence:'Докази й тести',boundaries:'Межі й запобіжники',next:'Відкриті рубежі й наступні кроки',lineage:'Джерела й походження',mechanism:'Механізми й реалізація'},ru:{purpose:'Зачем этот сарай вообще стоит',claims:'Что мы тут якобы утверждаем',evidence:'Чеки, тесты и прочие бумажки',boundaries:'Где табуретка заканчивается',next:'Куда ещё не надо бежать с фанфарами',lineage:'Откуда этот JSON выполз',mechanism:'Шестерёнки, провода и магия без магии'}};
function localConcepts(node,records){const groups={};for(const [k,re] of Object.entries(CAT)){const x=records.filter(r=>re.test(r.path));if(x.length)groups[k]=x}let entries=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).slice(0,MAX_CONCEPTS);if(entries.length<2){const byTop={};records.forEach(r=>{const m=r.path.match(/^\$\.([^\.\[]+)/);const k=m?m[1]:'context';(byTop[k]||(byTop[k]=[])).push(r)});entries=Object.entries(byTop).sort((a,b)=>b[1].length-a[1].length).slice(0,MAX_CONCEPTS)}const emoji={purpose:'🎯',claims:'◇',evidence:'🔎',boundaries:'🛡️',next:'➡️',lineage:'🧬',mechanism:'⚙️'};const concepts=entries.map(([k,rs])=>({title:CAT_LABEL[lang][k]||humanize(k),emoji:emoji[k]||'✦',summary:rs[0]?.value||'',sourcePaths:rs.slice(0,10).map(r=>r.path)}));return {mode:t('local'),selfEmoji:'◇',concepts}}
function humanize(s){return String(s).replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}

async function synthSelected(byJanus){if(!canSynth(selected)||synthBusy){if(selected&&(selected.depth||0)>=MAX_DEPTH)toast(t('depth'));return}const parent=selected;synthBusy=true;clearGuide();updateControls();const btn=document.getElementById('btn-synth');btn.classList.add('loading');btn.textContent='…';try{const data=await loadSource(parent);const records=recordsFor(parent,data);const {used}=packet(records);if(!used.length)throw new Error('empty');let bundle;try{bundle=await remoteConcepts(parent,used)}catch(e){console.warn('Remote semantic SYNTH unavailable:',e);bundle=localConcepts(parent,used)}if(bundle.selfEmoji&&parent.kind==='object')parent.emoji=bundle.selfEmoji;const existing=new Set(nodes.filter(n=>n.parentSemanticId===parent.id).map(n=>n.label.toLowerCase()));const fresh=bundle.concepts.filter(c=>!existing.has(String(c.title).toLowerCase())).slice(0,MAX_CONCEPTS);fresh.forEach((c,i)=>{const angle=(Math.PI*2/fresh.length)*i+(Math.random()*.24);const child={id:`sem:${Date.now()}:${i}`,label:c.title,emoji:c.emoji||'✦',summary:c.summary||'',kind:'semantic',sourceObjectId:parent.sourceObjectId||parent.id,sourcePaths:c.sourcePaths||[],depth:(parent.depth||0)+1,parentSemanticId:parent.id,synthMode:bundle.mode,x:(parent.x||width/2)+Math.cos(angle)*135,y:(parent.y||height/2)+Math.sin(angle)*135};nodes.push(child);links.push({source:parent.id,target:child.id});setTimeout(()=>impulse(parent,child),i*150)});render();openPanel(parent);if(byJanus){toast(t('guideToast'));markGuide(parent)}else toast(`${bundle.mode} · ${fresh.length}`)}catch(e){console.error(e);toast(t('nojson'))}finally{synthBusy=false;btn.classList.remove('loading');btn.textContent=t('synth');updateControls();lastHumanAction=Date.now()}}
function impulse(a,b){const dot=impulseLayer.append('circle').attr('class','impulse').attr('r',3).attr('cx',a.x).attr('cy',a.y);dot.transition().duration(650).attr('cx',b.x).attr('cy',b.y).remove()}
function markGuide(node){nodeLayer.selectAll('g.node').classed('guide',d=>d.id===node.id);setTimeout(()=>nodeLayer.selectAll('g.node').classed('guide',false),1700)}

document.getElementById('btn-synth').onclick=()=>{lastHumanAction=Date.now();synthSelected(false)};
document.getElementById('btn-origin').onclick=()=>{lastHumanAction=Date.now();rootView()};document.getElementById('btn-ascend').onclick=()=>{lastHumanAction=Date.now();if(currentSurface)rootView()};
document.getElementById('btn-guide').onclick=()=>{guideEnabled=!guideEnabled;localStorage.setItem(GUIDE_KEY,guideEnabled?'on':'off');clearGuide();updateControls();if(guideEnabled&&selected)scheduleGuide(selected)};
function clearGuide(){if(guideTimer){clearTimeout(guideTimer);guideTimer=null}}
function stableDelay(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return 9000+(h%7000)}
function scheduleGuide(node){clearGuide();if(!guideEnabled||!canSynth(node))return;const token=node.id;guideTimer=setTimeout(()=>{guideTimer=null;if(!guideEnabled||synthBusy||!selected||selected.id!==token)return;if(Date.now()-lastHumanAction<7000){scheduleGuide(node);return}const already=sessionStorage.getItem('janus-guide:'+token);if(already)return;sessionStorage.setItem('janus-guide:'+token,'1');synthSelected(true)},stableDelay(token))}
function toast(text){const x=document.getElementById('toast');x.textContent=text;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}

async function boot(){applyLanguage();try{const r=await fetch(INDEX_URL,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error('index '+r.status);indexData=await r.json();if(indexData.mutationPolicy?.interfaceWriteAuthority!==false||indexData.mutationPolicy?.interfaceDeleteAuthority!==false)throw new Error('unsafe mutation policy');rootView();const params=new URLSearchParams(location.search);const wanted=params.get('object');if(wanted){const n=indexData.nodes.find(x=>x.path===wanted||x.id===wanted);if(n&&n.surface&&n.path?.endsWith('.json')){enterSurface(n.surface);setTimeout(()=>{const d=nodes.find(x=>x.id===n.id);if(d)selectNode(d,false)},300)}}document.getElementById('loading').classList.add('hidden')}catch(e){console.error(e);document.getElementById('loading').textContent='JANUS REGISTRY UNAVAILABLE'}}
window.addEventListener('resize',()=>{width=innerWidth;height=innerHeight;sim.force('x',d3.forceX(()=>width/2).strength(.012));sim.force('y',d3.forceY(()=>height/2).strength(.012));sim.alpha(.25).restart()});
boot();
})();
